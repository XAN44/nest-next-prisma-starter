services:
  postgres:
    image: postgres:16
    container_name: shop_postgres
    restart: always
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop123
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    volumes:
      - shop_postgres_data:/var/lib/postgresql/data

volumes:
  shop_postgres_data:
